<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas de Información 2 - AulaU</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0f172a; /* Azul muy oscuro, casi negro */
            --bg-panel: #1e293b; /* Azul oscuro para paneles */
            --bg-element: #334155; /* Un poco más claro para inputs */
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #14b8a6; /* Verde Teal / Esmeralda */
            --primary-hover: #0d9488;
            --danger: #ef4444;
            --success: #10b981;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        /* --- HEADER SUPERIOR --- */
        .header {
            background-color: var(--bg-panel); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .logo-area h1 { font-size: 22px; font-weight: 700; color: var(--text-main); }
        .logo-area p { font-size: 13px; color: var(--primary); font-weight: 500; }
        
        .profile { display: flex; align-items: center; gap: 15px; }
        .profile-text { text-align: right; }
        .profile-text h4 { font-size: 14px; font-weight: 600; }
        .profile-text p { font-size: 12px; color: var(--text-muted); }
        .avatar { width: 40px; height: 40px; border-radius: 8px; background: var(--primary); color: var(--bg-dark); display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 16px; }

        /* --- PESTAÑAS ARRIBA --- */
        .tabs-container { display: flex; justify-content: center; gap: 10px; padding: 20px; background-color: var(--bg-dark); }
        .tab-btn {
            background: transparent; border: 1px solid var(--border); color: var(--text-muted); 
            padding: 10px 24px; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        .tab-btn:hover { background: var(--bg-element); color: var(--text-main); }
        .tab-btn.active { background: var(--primary); border-color: var(--primary); color: var(--bg-dark); box-shadow: 0 4px 10px rgba(20, 184, 166, 0.2); }

        /* --- AREA DE CONTENIDO --- */
        .main-area { flex: 1; padding: 0 40px 40px 40px; max-width: 1200px; margin: 0 auto; width: 100%; }
        .view { display: none; animation: fadeIn 0.3s; }
        .view.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* --- TARJETAS Y PANELES --- */
        .panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .panel-header h2 { font-size: 18px; font-weight: 600; }

        /* --- BUSCADOR --- */
        .search-container { position: relative; max-width: 400px; margin-bottom: 25px; }
        .search-input { width: 100%; padding: 12px 20px 12px 40px; background: var(--bg-element); border: 1px solid var(--border); border-radius: 8px; color: white; font-size: 14px; outline: none; transition: 0.2s; }
        .search-input:focus { border-color: var(--primary); }
        .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; fill: var(--text-muted); }
        .search-results { position: absolute; top: 110%; left: 0; right: 0; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 8px; max-height: 200px; overflow-y: auto; z-index: 20; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .result-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 14px; }
        .result-item:hover { background: var(--bg-element); }
        .result-item.disabled { color: var(--text-muted); cursor: not-allowed; text-decoration: line-through; }

        /* --- GRILLA DE ASIENTOS --- */
        .classroom { background: var(--bg-element); padding: 30px; border-radius: 12px; border: 1px solid var(--border); display: flex; justify-content: center; }
        .seat-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
        
        .seat {
            width: 70px; height: 60px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.2s; font-size: 13px; color: var(--text-muted);
        }
        .seat:hover { border-color: var(--primary); background: rgba(20, 184, 166, 0.1); color: var(--primary); }
        .seat.occupied { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); color: var(--danger); }
        .seat.occupied:hover { background: rgba(239, 68, 68, 0.2); }
        .seat .name { font-size: 10px; margin-top: 3px; }

        /* --- TABLAS MODERNAS --- */
        .table-container { width: 100%; border-collapse: collapse; }
        .table-container th { text-align: left; padding: 15px; color: var(--text-muted); font-size: 13px; font-weight: 500; border-bottom: 1px solid var(--border); }
        .table-container td { padding: 15px; border-bottom: 1px solid var(--border); font-size: 14px; }
        .table-container tr:hover td { background: var(--bg-element); }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-danger { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
        .badge-success { background: rgba(16, 185, 129, 0.15); color: var(--success); }
        .badge-primary { background: rgba(20, 184, 166, 0.15); color: var(--primary); }
        
        .btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: transparent; color: white; cursor: pointer; transition: 0.2s; font-size: 13px; }
        .btn:hover { background: var(--bg-element); border-color: var(--primary); color: var(--primary); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo-area">
            <h1>SISTEMAS DE INFORMACIÓN 2</h1>
            <p>AulaU - Gestión Académica</p>
        </div>
        <div class="profile">
            <div class="profile-text">
                <h4>Marcelo Flores</h4>
                <p>Docente</p>
            </div>
            <div class="avatar">MF</div>
        </div>
    </header>

    <!-- PESTAÑAS ARRIBA -->
    <div class="tabs-container">
        <button class="tab-btn active" onclick="switchView('asientos', this)">Asientos</button>
        <button class="tab-btn" onclick="switchView('asistencia', this)">Asistencia</button>
        <button class="tab-btn" onclick="switchView('alumnos', this)">Alumnos</button>
    </div>

    <!-- CONTENIDO -->
    <main class="main-area">
        
        <!-- VISTA: ASIENTOS -->
        <div id="view-asientos" class="view active">
            <div class="panel">
                <div class="panel-header">
                    <h2>Asignación de Asientos</h2>
                </div>
                
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="search-input" class="search-input" placeholder="Buscar estudiante por nombre o código..." onkeyup="filterStudents()" onfocus="showResults()">
                    <div id="search-results" class="search-results"></div>
                </div>

                <div class="classroom">
                    <div id="seat-grid" class="seat-grid"></div>
                </div>
            </div>
        </div>

        <!-- VISTA: ASISTENCIA -->
        <div id="view-asistencia" class="view">
            <div class="panel">
                <div class="panel-header">
                    <h2>Control de Asistencia</h2>
                </div>
                <table class="table-container">
                    <thead>
                        <tr>
                            <th>Estudiante</th>
                            <th>Código</th>
                            <th>Estado</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="attendance-body"></tbody>
                </table>
            </div>
        </div>

        <!-- VISTA: ALUMNOS -->
        <div id="view-alumnos" class="view">
            <div class="panel">
                <div class="panel-header">
                    <h2>Directorio de Alumnos</h2>
                </div>
                <table class="table-container">
                    <thead>
                        <tr>
                            <th>Estudiante</th>
                            <th>Código</th>
                            <th>Asiento Asignado</th>
                        </tr>
                    </thead>
                    <tbody id="students-body"></tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // --- 1. NAVEGACIÓN (Pestañas) ---
        function switchView(viewId, btn) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('view-' + viewId).classList.add('active');
            btn.classList.add('active');
        }

        // --- 2. DATOS ---
        const students = [
            { name: "Ana Pérez", code: "2023001" }, { name: "Luis Gómez", code: "2023002" },
            { name: "María López", code: "2023003" }, { name: "Carlos Ruiz", code: "2023004" },
            { name: "Elena Torres", code: "2023005" }, { name: "Jorge Mendoza", code: "2023006" },
            { name: "Lucía Fernández", code: "2023007" }, { name: "Pedro Ramírez", code: "2023008" },
            { name: "Sofía Castro", code: "2023009" }, { name: "Diego Vargas", code: "2023010" },
            { name: "Camila Rojas", code: "2023011" }, { name: "Andrés Silva", code: "2023012" },
            { name: "Valentina Ortiz", code: "2023013" }, { name: "Gabriel Morales", code: "2023014" },
            { name: "Isabella Herrera", code: "2023015" }
        ];

        let seats = JSON.parse(localStorage.getItem('seats_db')) || {};
        let attendance = JSON.parse(localStorage.getItem('attendance_db')) || {};
        let selectedStudent = null;

        document.addEventListener("DOMContentLoaded", () => {
            renderSeats();
            renderAttendance();
            renderStudentDirectory();
        });

        // --- 3. BUSCADOR ---
        function showResults() {
            document.getElementById('search-results').style.display = 'block';
            filterStudents();
        }

        function filterStudents() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const container = document.getElementById('search-results');
            container.innerHTML = '';

            const filtered = students.filter(s => s.name.toLowerCase().includes(query) || s.code.includes(query));

            if (filtered.length === 0) {
                container.innerHTML = '<div class="result-item disabled">No hay resultados</div>';
                return;
            }

            filtered.forEach(s => {
                let assignedSeat = Object.keys(seats).find(key => seats[key] === s.name);
                const div = document.createElement('div');
                div.className = 'result-item';
                
                if (assignedSeat) {
                    div.classList.add('disabled');
                    div.innerHTML = `${s.name} - Ya tiene asiento #${assignedSeat}`;
                } else {
                    div.innerHTML = `${s.name} (${s.code})`;
                    div.onclick = () => selectStudent(s.name);
                }
                container.appendChild(div);
            });
        }

        function selectStudent(name) {
            selectedStudent = name;
            document.getElementById('search-input').value = name;
            document.getElementById('search-results').style.display = 'none';
        }

        document.addEventListener('click', (e) => {
            const searchBox = document.querySelector('.search-container');
            if (searchBox && !searchBox.contains(e.target)) {
                document.getElementById('search-results').style.display = 'none';
            }
        });

        // --- 4. RENDERIZAR ASIENTOS (5x10) ---
        function renderSeats() {
            const grid = document.getElementById('seat-grid');
            grid.innerHTML = ''; 

            for (let i = 1; i <= 50; i++) {
                const seatDiv = document.createElement('div');
                seatDiv.className = 'seat';

                if (seats[i]) {
                    seatDiv.classList.add('occupied');
                    const firstName = seats[i].split(' ')[0];
                    seatDiv.innerHTML = `<span>#${i}</span><span class="name">${firstName}</span>`;
                } else {
                    seatDiv.innerHTML = `<span>#${i}</span>`;
                }

                seatDiv.onclick = () => handleSeatClick(i);
                grid.appendChild(seatDiv);
            }
        }

        function handleSeatClick(num) {
            if (seats[num]) {
                if (confirm(`El asiento #${num} está ocupado por ${seats[num]}.\n¿Deseas liberarlo?`)) {
                    delete seats[num];
                    saveDB();
                    renderSeats();
                    renderStudentDirectory();
                }
                return;
            }

            if (!selectedStudent) { 
                alert("Primero busca y selecciona un estudiante."); 
                return; 
            }

            seats[num] = selectedStudent;
            saveDB();
            renderSeats();
            renderStudentDirectory();
            document.getElementById('search-input').value = "";
            selectedStudent = null;
        }

        // --- 5. TABLA DE ALUMNOS ---
        function renderStudentDirectory() {
            const tbody = document.getElementById('students-body');
            tbody.innerHTML = '';

            students.forEach(s => {
                let assignedSeat = Object.keys(seats).find(key => seats[key] === s.name);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 600;">${s.name}</td>
                    <td style="color: var(--text-muted);">${s.code}</td>
                    <td>
                        ${assignedSeat 
                            ? `<span class="badge badge-primary">Asiento #${assignedSeat}</span>` 
                            : `<span class="badge badge-danger">Sin asiento</span>`}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function saveDB() {
            localStorage.setItem('seats_db', JSON.stringify(seats));
        }

        // --- 6. TABLA DE ASISTENCIA ---
        function renderAttendance() {
            const tbody = document.getElementById('attendance-body');
            tbody.innerHTML = '';
            
            students.forEach((s, index) => {
                const status = attendance[index] || "Presente";
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: 600;">${s.name}</td>
                    <td style="color: var(--text-muted);">${s.code}</td>
                    <td>
                        <span class="badge ${status === 'Presente' ? 'badge-success' : 'badge-danger'}" id="status-${index}">
                            ${status}
                        </span>
                    </td>
                    <td>
                        <button class="btn" onclick="toggleAttendance(${index})">Cambiar</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleAttendance(index) {
            const statusSpan = document.getElementById(`status-${index}`);
            const isPresent = statusSpan.innerText === "Presente";
            
            if (isPresent) {
                statusSpan.innerText = "Ausente";
                statusSpan.className = "badge badge-danger";
                attendance[index] = "Ausente";
            } else {
                statusSpan.innerText = "Presente";
                statusSpan.className = "badge badge-success";
                attendance[index] = "Presente";
            }
            localStorage.setItem('attendance_db', JSON.stringify(attendance));
        }
    </script>
</body>
</html>
